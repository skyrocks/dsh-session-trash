<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <filter id="panel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1100" height="720" fill="#f2f3f5"/>

  <g filter="url(#panel)">
    <rect x="70" y="60" width="960" height="600" rx="16" fill="#ffffff"/>
  </g>

  <!-- settings nav -->
  <rect x="70" y="60" width="220" height="600" rx="16" fill="#f7f8fa"/>
  <g font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="13">
    <text x="94" y="104" fill="#8a8f98" font-size="11.5" letter-spacing="0.6">设置</text>
    <text x="94" y="146" fill="#5c6169">通用</text>
    <text x="94" y="182" fill="#5c6169">模型</text>
    <text x="94" y="218" fill="#5c6169">插件</text>
    <text x="94" y="254" fill="#5c6169">快捷方式</text>
    <rect x="82" y="268" width="196" height="34" rx="8" fill="#eef1fb"/>
    <text x="94" y="290" fill="#1f2329" font-weight="600">回收站</text>
  </g>

  <!-- header -->
  <g font-family="PingFang SC, Helvetica, Arial, sans-serif">
    <text x="326" y="112" font-size="16" fill="#1f2329" font-weight="600">回收站</text>
    <text x="326" y="136" font-size="11" fill="#b0b4bb">~/.dsh/trash/sessions</text>
    <text x="326" y="164" font-size="11.5" fill="#8a8f98">恢复只把目录搬回原位；FTS 索引会在下次搜索时自动补回。</text>
  </g>

  <!-- list -->
  <g font-family="PingFang SC, Helvetica, Arial, sans-serif">
    <rect x="326" y="184" width="664" height="78" rx="10" fill="#fbfbfc" stroke="#eceef1"/>
    <text x="346" y="214" font-size="13" fill="#1f2329">删除回收站功能：先做插件</text>
    <text x="346" y="236" font-size="11" fill="#9aa0a8">2026-11-10 10:41 · 2.4 MB · 含 3 个子会话</text>
    <text x="846" y="224" font-size="12" fill="#4d6bfe" font-weight="500">恢复</text>
    <text x="916" y="224" font-size="12" fill="#4d6bfe" font-weight="500">彻底删除</text>

    <rect x="326" y="272" width="664" height="78" rx="10" fill="#fbfbfc" stroke="#eceef1"/>
    <text x="346" y="302" font-size="13" fill="#1f2329">2026-08 旧会话</text>
    <text x="346" y="324" font-size="11" fill="#9aa0a8">2026-11-09 18:07 · 860 KB · 恢复后仍归档</text>
    <text x="846" y="312" font-size="12" fill="#4d6bfe" font-weight="500">恢复</text>
    <text x="916" y="312" font-size="12" fill="#4d6bfe" font-weight="500">彻底删除</text>
  </g>

  <!-- footer -->
  <line x1="326" y1="560" x2="990" y2="560" stroke="#eceef1"/>
  <g font-family="PingFang SC, Helvetica, Arial, sans-serif">
    <text x="326" y="592" font-size="11" fill="#9aa0a8">回收站占用磁盘空间，清空后才真正删除。</text>
    <rect x="856" y="574" width="134" height="30" rx="8" fill="#ffffff" stroke="#dfe2e6"/>
    <text x="882" y="594" font-size="11.5" fill="#5c6169">清空回收站</text>
  </g>

  <text x="1012" y="700" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="11" fill="#b0b4bb">界面示意图</text>
</svg>
